<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>プロジェクト・クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#141a2e; --bg2:#10152a; --panel:#1f2745; --panel2:#2a3358; --line:#39447a;
  --ink:#eef0ff; --dim:#9aa3c7; --amber:#ffc857; --coral:#ff6b6b; --teal:#3ddbc2; --violet:#a78bfa;
  --good:#3ddbc2; --warn:#ffc857; --bad:#ff6b6b;
  --pix:"DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --body:"Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:12px 40px;
  background:
   radial-gradient(1200px 500px at 50% -200px, #26306080, transparent 70%),
   repeating-linear-gradient(0deg, transparent 0 23px, #ffffff06 23px 24px),
   repeating-linear-gradient(90deg, transparent 0 23px, #ffffff06 23px 24px),
   var(--bg);
  min-height:100vh}
#app{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pix{font-family:var(--pix);letter-spacing:.04em}
h1,h2,h3{font-family:var(--pix);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.04em}
h2{font-size:24px;line-height:1.35}
h3{font-size:18px}
p{margin:0}
.dim{color:var(--dim)}
.small{font-size:13px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.logo{font-family:var(--pix);font-size:18px;color:var(--amber);letter-spacing:.08em;background:none;border:0;padding:0}
.logo span{color:var(--ink)}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.chip.lv{border-color:var(--amber);color:var(--amber)}
.chip:hover{border-color:var(--amber)}

/* ---- stage track ---- */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.track .st{font-family:var(--pix);font-size:12px;text-align:center;padding:6px 2px;background:var(--panel);border:1px solid var(--line);color:var(--dim);position:relative;line-height:1.3}
.track .st.done{color:var(--teal);border-color:#2b6b63}
.track .st.now{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.track .st b{display:block;font-weight:400;font-size:10px;opacity:.8}

/* ---- gauges ---- */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.g{background:var(--panel);border:1px solid var(--line);padding:5px 8px;border-radius:4px}
.g .gl{display:flex;justify-content:space-between;font-size:12px;font-family:var(--pix)}
.g .bar{height:8px;background:var(--bg2);margin-top:4px;border-radius:2px;overflow:hidden}
.g .bar i{display:block;height:100%;transition:width .6s ease}
.g.low{border-color:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ff6b6b40}}

/* ---- main card ---- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 0 0 4px var(--bg2), 0 10px 30px #0006}
.eyebrow{font-family:var(--pix);font-size:12px;color:var(--amber);letter-spacing:.12em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--pix);background:var(--amber);color:#1b1b2b;border:0;border-bottom:4px solid #b8892a;padding:10px 18px;border-radius:4px;font-size:16px;letter-spacing:.06em}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-bottom:3px solid var(--line)}
.btn.teal{background:var(--teal);border-bottom-color:#1f8f7e}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 14px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--amber)}
.opt.sel{border-color:var(--amber);background:#3a3a50;box-shadow:inset 4px 0 0 var(--amber)}
.opt.ok{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.opt.ng{border-color:var(--coral);box-shadow:inset 4px 0 0 var(--coral)}
.opt[disabled]{cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.hint{font-size:13px;color:var(--dim);border-left:3px solid var(--violet);padding:4px 10px;background:#a78bfa12}
.speech{display:flex;gap:12px;align-items:flex-start}
.face{font-size:40px;line-height:1;background:var(--panel2);border:2px solid var(--line);border-radius:6px;width:64px;height:64px;display:grid;place-items:center;flex:none}
.bubble{background:var(--ink);color:#1b1b2b;border-radius:6px;padding:10px 14px;position:relative;flex:1;min-height:48px}
.bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .who{font-family:var(--pix);font-size:12px;color:#5b5f86;display:block}
.tag{display:inline-block;font-family:var(--pix);font-size:11px;padding:1px 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.term{border-bottom:1px dotted var(--dim)}

/* ---- note (after stage) ---- */
.note{background:#0f1428;border:2px dashed var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note h3{color:var(--amber)}
.note ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.stars{font-size:26px;letter-spacing:4px;color:var(--amber)}
.stars .off{color:#3a4270}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{font-family:var(--pix);font-size:12px;padding:2px 8px;border-radius:3px;background:var(--panel2)}
.delta.up{color:var(--teal)} .delta.dn{color:var(--coral)}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl button{font-size:12px;background:#ffc85718;border:1px solid var(--amber);color:var(--amber);border-radius:3px;padding:2px 8px}

/* ---- stakeholder map ---- */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.qz{min-height:120px;background:var(--panel2);border:2px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.qz.arm{border-color:var(--amber)}
.qz .qn{font-family:var(--pix);font-size:13px}
.qz .qs{font-size:11px;color:var(--dim)}
.pcard{font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;text-align:left;line-height:1.4}
.pcard.sel{border-color:var(--amber);box-shadow:0 0 0 2px #ffc85750}
.pcard b{font-weight:700;display:block}
.axis{font-size:11px;color:var(--dim);font-family:var(--pix)}

/* ---- wbs well ---- */
.well{position:relative;height:300px;background:linear-gradient(#0e1326,#1a2142);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.fall{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:#1b1b2b;font-weight:700;padding:10px 16px;border-radius:4px;white-space:nowrap;box-shadow:0 4px 0 #0005;font-size:16px;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--coral);opacity:.6}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bin{background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:10px 6px;font-family:var(--pix);font-size:13px;line-height:1.3;min-height:64px}
.bin.out{border-color:var(--coral);color:#ffb3b3}
.bin kbd{display:block;font-size:10px;color:var(--dim)}
.flash-ok{animation:fok .4s} .flash-ng{animation:fng .4s}
@keyframes fok{0%{background:var(--teal)}} @keyframes fng{0%{background:var(--coral)}}

/* ---- canvas games ---- */
.cv{width:100%;display:block;background:#0e1326;border:2px solid var(--line);border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--pix);font-size:13px}
.sbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sbtn{border:2px solid;border-radius:4px;padding:8px 4px;background:var(--bg2);font-family:var(--pix);line-height:1.25;font-size:15px}
.sbtn small{display:block;font-size:10px;opacity:.8;font-family:var(--body)}
.sbtn kbd{font-size:10px;opacity:.6}

/* ---- conflict ---- */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:linear-gradient(#232c55,#141a2e);border:2px solid var(--line);border-radius:6px;padding:14px}
.fighter{text-align:center;font-family:var(--pix);font-size:13px}
.fighter .fx{font-size:46px;display:block;transition:transform .2s}
.fighter.hit .fx{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vs{font-family:var(--pix);color:var(--coral);font-size:22px}
.meter{position:relative;height:26px;background:var(--bg2);border:2px solid var(--line);border-radius:4px;overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:#3ddbc255;border-left:2px solid var(--teal);border-right:2px solid var(--teal)}
.meter .mk{position:absolute;top:0;bottom:0;width:4px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.bigmove{font-family:var(--pix);font-size:26px;color:var(--amber);text-align:center;min-height:36px;text-shadow:0 0 12px #ffc85780}
.hp{height:12px;background:var(--bg2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;transition:width .5s}

/* ---- network ---- */
.net{overflow-x:auto;background:#0e1326;border:2px solid var(--line);border-radius:6px}
.net svg{display:block;width:100%}
.nnode{cursor:pointer}
.nnode rect{fill:#2a3358;stroke:#5a66a8;stroke-width:2}
.nnode.sel rect{fill:#4a3d1c;stroke:var(--amber)}
.nnode text{fill:var(--ink);font-family:var(--pix);font-size:13px}
.nnode .dur{fill:var(--amber);font-size:12px}
.nedge{stroke:#5a66a8;stroke-width:2;fill:none}

/* ---- evm ---- */
.evbars{display:flex;flex-direction:column;gap:8px}
.evb{display:grid;grid-template-columns:130px 1fr 80px;gap:8px;align-items:center;font-size:13px}
.evb .tr{height:18px;background:var(--bg2);border-radius:2px;overflow:hidden}
.evb .tr i{display:block;height:100%}
.evb .v{font-family:var(--pix);text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:90px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;font-family:var(--pix)}
.seg button.sel{border-color:var(--amber);color:var(--amber)}

/* ---- result ---- */
.rank{font-family:var(--pix);font-size:72px;line-height:1;color:var(--amber);text-shadow:4px 4px 0 #b8892a}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.badge{border:1px solid var(--line);border-radius:4px;padding:8px;font-size:13px;background:var(--panel2);line-height:1.4}
.badge.on{border-color:var(--amber);background:#ffc85714}
.badge b{font-family:var(--pix);font-weight:400;display:block;font-size:14px}
.badge.off{opacity:.45}

/* ---- title ---- */
.hero{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:10px 0}
.hero h1{font-size:clamp(34px,7vw,58px);line-height:1.1;color:var(--amber);text-shadow:4px 4px 0 #6b4a12, 0 0 30px #ffc85740}
.hero h1 small{display:block;font-size:.36em;color:var(--ink);text-shadow:none;letter-spacing:.3em;margin-top:6px}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;width:100%}
.lvc{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lvc:hover:not([disabled]){border-color:var(--amber);transform:translateY(-2px)}
.lvc .n{font-family:var(--pix);font-size:22px;color:var(--amber)}
.lvc[disabled]{opacity:.45;cursor:not-allowed}
.scene{position:relative;height:120px;width:100%;overflow:hidden;border:2px solid var(--line);border-radius:6px;background:linear-gradient(#1b2350,#0e1326)}

/* ---- codex modal ---- */
.modal{position:fixed;inset:0;background:#070a18e0;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;overflow-y:auto}
.modal .box{max-width:880px;width:100%;background:var(--panel);border:2px solid var(--amber);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font-family:var(--pix);font-size:13px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.tabs button.on{border-color:var(--amber);color:var(--amber)}
.centry{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.centry.lock{opacity:.5}
.centry .cn{font-family:var(--pix);font-size:15px}
.centry .ex{font-size:13px;color:var(--dim)}
.centry.hl{border-color:var(--amber)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.domh{font-family:var(--pix);font-size:14px;margin-top:6px;display:flex;gap:8px;align-items:center}
.progress{height:10px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--amber)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--amber);color:#1b1b2b;font-family:var(--pix);padding:8px 16px;border-radius:4px;z-index:60;box-shadow:0 6px 20px #0008;animation:tin .3s}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.legal{font-size:12px;color:var(--dim);line-height:1.6}
@media (max-width:560px){
  .card{padding:14px}
  h2{font-size:20px}
  .bins{grid-template-columns:repeat(2,1fr)}
  .sbtns{grid-template-columns:repeat(2,1fr)}
  .evb{grid-template-columns:96px 1fr 64px}
  .track .st{font-size:10px}
  .track .st b{display:none}
  .gauges{grid-template-columns:repeat(4,1fr);gap:4px}
  .g{padding:3px 5px}
  .g .gl{font-size:10px}
  .g .gname{display:inline-block;max-width:4.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app">
  <div class="topbar">
    <button class="logo" id="homeBtn" aria-label="タイトルへ">PROJECT<span>・</span>QUEST</button>
    <div class="topbtns">
      <span class="chip lv" id="lvChip" hidden></span>
      <button class="chip" id="codexBtn">知識図鑑 <span id="codexCount"></span></button>
    </div>
  </div>
  <div class="track" id="track" hidden></div>
  <div class="gauges" id="gauges" hidden></div>
  <div id="main"></div>
</div>
<div id="modalRoot"></div>
<script>
// ===== 知識図鑑データ =====
// 解説文はすべて独自に書き下ろしたもの（原文の翻訳・転載ではない）
const DOMAINS = {
  gov:   { name: "ガバナンス",     easy: "しくみ・決まり", icon: "⚖", color: "#a78bfa" },
  scope: { name: "スコープ",       easy: "やること",       icon: "▦", color: "#5ec8ff" },
  sched: { name: "スケジュール",   easy: "時間",           icon: "◷", color: "#ffc857" },
  fin:   { name: "財務",           easy: "お金",           icon: "¥", color: "#7ee081" },
  stake: { name: "ステークホルダー", easy: "関わる人",     icon: "☺", color: "#ff9fcf" },
  res:   { name: "資源",           easy: "仲間・道具",     icon: "✦", color: "#3ddbc2" },
  risk:  { name: "リスク",         easy: "もしも",         icon: "⚠", color: "#ff8a5b" },
};
const DOMAIN_KEYS = ["gov","scope","sched","fin","stake","res","risk"];

const FOCUS = [
  { id: "a1", name: "立上げ",           easy: "はじめる" },
  { id: "a2", name: "計画",             easy: "計画する" },
  { id: "a3", name: "実行",             easy: "やってみる" },
  { id: "a4", name: "監視・コントロール", easy: "たしかめる" },
  { id: "a5", name: "終結",             easy: "しめくくる" },
];

// cat: principle / mindset / domain / focus / process / concept
const CODEX = [
  // --- 原則 6 ---
  { id:"p1", cat:"principle", name:"全体を見わたす", tag:"システム思考",
    desc:"プロジェクトは、時間・お金・人・リスクなどがつながり合った一つのシステム。一か所をいじると別の所に波が立つ。部分だけで判断せず、つながりごと見て決める。",
    ex:"内装にお金をかけすぎると、食材が買えなくなる。" },
  { id:"p2", cat:"principle", name:"価値に焦点を合わせる", tag:"アウトプットよりアウトカム",
    desc:"成果物を作ること自体がゴールではない。それによって誰に、どんな良い変化（価値）が生まれるかがゴール。迷ったら「それは価値につながる？」と問う。",
    ex:"売上より「来た人が楽しめた」が目的なら、判断の基準もそれに合わせる。" },
  { id:"p3", cat:"principle", name:"品質を最初から組み込む", tag:"後から検査より、作り方で守る",
    desc:"品質は最後のチェックで付け足すものではなく、作業の進め方と成果物の両方に最初から組み込むもの。ムダや手戻りを減らすことにもつながる。",
    ex:"本番前に試作と味見をする仕組みを、計画の中に入れておく。" },
  { id:"p4", cat:"principle", name:"説明責任を果たすリーダー", tag:"逃げない・隠さない・任せる",
    desc:"決めたことと結果に責任を持ち、状況を正直に伝える。自分が全部やるのではなく、状況に合わせてリーダーシップの型を変え、周りにも役割を任せる。",
    ex:"遅れを隠さずスポンサーに報告し、回復策を一緒に決める。" },
  { id:"p5", cat:"principle", name:"持続可能性を組み込む", tag:"環境・社会・経済",
    desc:"目先の完成だけでなく、環境への負荷、関わる人や地域への影響、長く使えるかどうかまで考えて判断する。どの領域の判断にも関わる考え方。",
    ex:"使い捨てカップをやめてリユースカップにする。" },
  { id:"p6", cat:"principle", name:"力を発揮できる文化をつくる", tag:"心理的安全性",
    desc:"メンバーが安心して意見を言え、自分で考えて動ける環境をつくる。対立は隠さず建設的に扱い、学び続けるチームにする。",
    ex:"失敗を責めるより、次どうするかを全員で話す。" },
  // --- マインドセット 3 ---
  { id:"m1", cat:"mindset", name:"先を読んで動く", tag:"プロアクティブ",
    desc:"問題が起きてから慌てるのではなく、起こりそうなことを先に考え、ちょうどよい量の計画を立てておく姿勢。",

function newGame(lv, practiceStep){
  const bonus = Math.min(assets.length, 3) * 3;
  S = { lv, sc: SCENARIOS[lv], step: 0, practice: practiceStep ?? null,
    approach: lv===3 ? "hybrid" : "pred",
    dom: Object.fromEntries(DOMAIN_KEYS.map(k=>[k, 60 + bonus])),
    flags:{}, scores:{}, mistakes:[], shield:0, prepared:0, reserveRate:0 };
}

function T(std, easy){
  if (!S || !easy) return std;
  if (S.lv===1) return easy;
  if (S.lv===2) return `${std}<span class="dim small">（${easy}）</span>`;
  return std;
}
function domLabel(k){ const d = DOMAINS[k]; return S && S.lv===1 ? d.easy : d.name; }

}

  $("#gauges").innerHTML = keys.map(k=>{
    const v = Math.round(S.dom[k]); const d = DOMAINS[k];
    return `<div class="g ${v<25?'low':''}" title="${d.name}"><div class="gl"><span>${d.icon} <span class="gname">${domLabel(k)}</span></span><span>${v}</span></div><div class="bar"><i style="width:${v}%;background:${d.color}"></i></div></div>`;
  }).join("");
}

function unlock(ids){
  const fresh = [];
  ids.forEach(id => { if (CODEX_BY_ID[id] && !unlocked.has(id)){ unlocked.add(id); fresh.push(id); } });
  store.set("pq_unlocked", [...unlocked]);
  return fresh;
}

const GAMES = {}; // id -> function(el)

function startStep(){
  drawChrome();
  const st = STEPS[S.step];
  if (!st) return showResult();
  if (st.id==="tailor" && S.practice===null && S.lv<3){ // Lv1/2 は説明のみ
    return GAMES.tailor();
  }
  unlock([FOCUS[st.fa].id]);
  GAMES[st.id]();
}

function stageHeader(title, lead){
  const st = STEPS[S.step];
  return `<div class="eyebrow">${S.lv===1?FOCUS[st.fa].easy:FOCUS[st.fa].name}の段階 ／ ${esc(st.genre)}</div>

/**
 * ステージ終了。score: 0〜1
 * doms: 影響する領域キー配列, notes: 学び(HTML), ids: 解放する図鑑ID
 */
function finish({score, doms=[], notes=[], ids=[], extra=""}){
  score = clamp(score, 0, 1);
  const st = STEPS[S.step];
  S.scores[st.id] = score;
  const deltas = {};
  doms.forEach(k => { const d = Math.round((score - 0.55) * 34); deltas[k]=(deltas[k]||0)+d; S.dom[k] = clamp(S.dom[k] + d, 0, 100); });
  const fresh = unlock(ids);
  drawChrome();
  const stars = score>=0.85?3:score>=0.6?2:score>=0.3?1:0;
  const showK = LEVELS[S.lv].gauges;
  const dhtml = Object.entries(deltas).filter(([k])=>showK.includes(k)).map(([k,v])=>`<span class="delta ${v>=0?'up':'dn'}">${DOMAINS[k].icon} ${domLabel(k)} ${v>=0?'+':''}${v}</span>`).join("");
  const box = document.createElement("div");
  box.className = "note";
  box.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h3>PMノート</h3>
      <div class="stars" aria-label="評価 ${stars}/3">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
    </div>
    ${extra}
    <ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul>
    ${dhtml?`<div class="deltas">${dhtml}</div>`:""}
    ${ids.length?`<div class="small dim">図鑑に登録${fresh.length?`（新しく ${fresh.length} 件）`:''}：</div><div class="unl">${ids.filter(i=>CODEX_BY_ID[i]).map(i=>`<button data-cx="${i}">${esc(CODEX_BY_ID[i].name)}</button>`).join("")}</div>`:""}
    <div class="row"><button class="btn" id="nextBtn">${S.practice!==null?'練習を終える':'つぎへ ▶'}</button></div>`;
  const card = $("#main .card") || $("#main");
  card.appendChild(box);
  $$("[data-cx]", box).forEach(b=>b.onclick=()=>openCodex(b.dataset.cx));
  $("#nextBtn").onclick = ()=>{
    if (S.practice!==null){ S=null; return showTitle(); }
    S.step++; startStep();
  };
  box.scrollIntoView({behavior:"smooth", block:"start"});
  $("#nextBtn").focus({preventScroll:true});
}

function openCodex(focusId){
  let cat = focusId ? CODEX_BY_ID[focusId].cat : "principle";
  const root = $("#modalRoot");
  const draw = ()=>{
    const items = CODEX.filter(c=>c.cat===cat);
    let body = "";
    const entry = c => {
      const open = unlocked.has(c.id);
      const meta = c.cat==="process" ? `<span class="tag">${DOMAINS[c.dom].name}</span> <span class="tag">${FOCUS.find(f=>f.id===c.fa).name}</span>` : (c.tag?`<span class="tag">${esc(c.tag)}</span>`:"");
      return `<div class="centry ${open?'':'lock'} ${c.id===focusId?'hl':''}" id="cx-${c.id}">
        <div class="cn">${open?esc(c.name):"？？？"}</div>
        <div>${meta}</div>
        <div class="small">${open?esc(c.desc):"まだ出会っていない知識。ゲームを進めると登録される。"}</div>
        ${open&&c.ex?`<div class="ex">たとえば：${esc(c.ex)}</div>`:""}
      </div>`;
    };
    if (cat==="process"){
      body = DOMAIN_KEYS.map(k=>{
        const list = items.filter(c=>c.dom===k);
        return `<div class="domh"><span style="color:${DOMAINS[k].color}">${DOMAINS[k].icon}</span>${DOMAINS[k].name}の領域 <span class="dim small">${list.filter(c=>unlocked.has(c.id)).length}/${list.length}</span></div><div class="cgrid">${list.map(entry).join("")}</div>`;
      }).join("");
    } else body = `<div class="cgrid">${items.map(entry).join("")}</div>`;
    const pct = Math.round(unlocked.size / CODEX.length * 100);
    root.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="知識図鑑"><div class="box">
      <div class="row" style="justify-content:space-between"><h2>知識図鑑</h2><button class="btn ghost" id="cxClose">とじる</button></div>
      <div class="small dim">プロジェクトマネジメントの国際的な知識体系にある考え方を、ゲーム用に自分たちの言葉でまとめたもの。登録 ${unlocked.size}/${CODEX.length}（${pct}%）</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="tabs">${Object.entries(CAT_LABEL).map(([k,v])=>{const n=CODEX.filter(c=>c.cat===k);return `<button data-cat="${k}" class="${k===cat?'on':''}">${v} ${n.filter(c=>unlocked.has(c.id)).length}/${n.length}</button>`}).join("")}</div>
      ${body}
    </div></div>`;
    $("#cxClose").onclick = ()=> root.innerHTML="";
    $(".modal").onclick = e => { if (e.target.classList.contains("modal")) root.innerHTML=""; };
    $$("[data-cat]", root).forEach(b=>b.onclick=()=>{cat=b.dataset.cat; focusId=null; draw();});
    if (focusId){ const el = $("#cx-"+focusId); el && el.scrollIntoView({block:"center"}); }
    $("#cxClose").focus({preventScroll:!!focusId});
  };
  draw();
}

function titleScene(cv){
  const ctx = cv.getContext("2d"); let t0 = performance.now(); let raf;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W*devicePixelRatio; cv.height=H*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
  const words = ["スコープ","スケジュール","財務","リスク","資源","関係者","ガバナンス","価値","品質","持続可能性"];
  const flies = words.map((w,i)=>({w, x: (i%5)*(W/7) + (i>4?(W+90)/2:0), y: 18 + (i%5)*16, v: 16 + (i%5)*3}));
  const tick = now=>{
    if (!document.body.contains(cv)) return cancelAnimationFrame(raf);
    const dt = Math.min(0.05,(now-t0)/1000); t0=now;
    ctx.clearRect(0,0,W,H);
    // 地面
    ctx.fillStyle="#2a3358"; ctx.fillRect(0,H-22,W,22);
    for(let x=0;x<W;x+=16){ ctx.fillStyle = (x/16)%2? "#323c68":"#2a3358"; ctx.fillRect(x,H-22,16,6); }
    // 旗
    ctx.fillStyle="#ffc857"; ctx.fillRect(W-40,H-70,4,48); ctx.fillRect(W-36,H-70,20,12);
    ctx.font = "13px DotGothic16, monospace";
    flies.forEach(f=>{ f.x -= f.v*dt; if (f.x < -90) f.x += W + 90;
      ctx.fillStyle="#9aa3c7"; ctx.fillText(f.w, f.x, f.y); });
    // 歩くPM
    const px = 40 + ((now/40) % Math.max(1,(W-120)));
    const bob = Math.sin(now/120)*2;
    ctx.fillStyle="#ffc857"; ctx.fillRect(px, H-46+bob, 14, 16);
    ctx.fillStyle="#eef0ff"; ctx.fillRect(px+2, H-58+bob, 10, 10);
    ctx.fillStyle="#141a2e"; ctx.fillRect(px+8, H-55+bob, 2, 2);
    ctx.fillStyle="#3ddbc2"; ctx.fillRect(px-6, H-44+bob, 6, 8);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

      `だれに・何を・いつ・どうやって伝えるか（${T("コミュニケーション計画","伝え方の計画")}）も、このマップをもとに決める。`,
    ]});
  };
  refresh();
};

// 5. WBSおとし（落ちものアクション）
GAMES.wbs = function(){
  const sc = S.sc; const cards = shuffle(sc.wbs.cards);
  const fallMs = 9000 / LEVELS[S.lv].speed;
  let idx = 0, ok = 0, y = 0, t0 = 0, raf = 0, busy = false; const miss = [];
  const m = render(`<div class="card">
    ${stageHeader(T("WBSおとし","やること分け"), `落ちてくる作業を、正しい成果物の箱に入れよう。<b>範囲外</b>のものは「スコープ外」へ！　床に落ちたらミス。`)}
    ${LEVELS[S.lv].hints?`<div class="hint">ヒント：頼まれていない「おまけ」や、別の人の仕事はスコープ外。</div>`:""}
    <div class="hud"><span id="wcount">1 / ${cards.length}</span><span id="wok">正解 0</span></div>
    <div class="well" id="well"><div class="fall" id="fall"></div><div class="floor"></div></div>
    <div class="bins">${sc.wbs.bins.map((b,i)=>`<button class="bin" data-b="${i}">${esc(b)}<kbd>${i+1}</kbd></button>`).join("")}<button class="bin out" data-b="-1">スコープ外<kbd>4</kbd></button></div>
    <div class="row"><button class="btn" id="wstart">スタート</button></div>
  </div>`);
  const well = $("#well"), fall = $("#fall");
  const H = () => well.clientHeight - 50;
  const next = ()=>{
    if (idx >= cards.length) return end();
    fall.textContent = cards[idx].t; y = 0; fall.style.top = "0px"; t0 = performance.now(); busy=false;
    $("#wcount").textContent = `${idx+1} / ${cards.length}`;
    raf = requestAnimationFrame(loop);
  };
  const loop = now=>{
    if (!document.body.contains(well)) return;
    y = (now - t0) / fallMs * H();
    fall.style.top = y + "px";
    if (y >= H()) return judge(null);
    raf = requestAnimationFrame(loop);
  };
  const judge = b=>{
    if (busy || idx>=cards.length) return; busy = true; cancelAnimationFrame(raf);
    const c = cards[idx]; const right = b===c.b;
    if (right){ ok++; if (c.quality) S.flags.qualityCard = true; }
    else miss.push(c.b===-1 ? `「${esc(c.t)}」は範囲外：${esc(c.why)}` : `「${esc(c.t)}」は「${esc(sc.wbs.bins[c.b])}」の作業${b===null?"（時間切れ）":""}`);
    fall.classList.remove("flash-ok","flash-ng"); void fall.offsetWidth; fall.classList.add(right?"flash-ok":"flash-ng");
    $("#wok").textContent = `正解 ${ok}`;
    idx++; setTimeout(next, 380);
  };
  const end = ()=>{
    fall.textContent = "おしまい！"; fall.style.top = "40%";
    document.removeEventListener("keydown", key);
    $$(".bin").forEach(b=>b.disabled=true);
    if (miss.some(x=>x.includes("範囲外"))) S.mistakes.push("範囲外の作業を取りこみかけた");
    finish({ score: ok/cards.length, doms:["scope","res","sched"], ids:["s1","s3","s4","c_wbs","c_gold","d2","r1","r2","g2","p3"], notes:[
      `大きな成果物を、管理できる大きさの作業に分けたものが${T("WBS","作業の分解図")}。子を全部足すと親の100％、範囲外は入れない（100％ルール）。`,
      `頼まれていない「おまけ」を足すのは<b>${T("金メッキ","やりすぎ")}</b>。コストとリスクだけが増える。`,
      S.flags.qualityCard ? "「試作・チェック・テスト」を計画に入れられた。品質は最後に検査するより、作り方に組み込むもの。" : "試作やテストなど<b>品質を確かめる作業</b>も、最初から計画に入れておこう。",
      ...miss.slice(0,4),
      `分けた作業ごとに、必要な人数・スキル・道具を見積もる（${T("資源の見積り","人と道具の見積り")}）。`,
    ]});
  };
  const key = e=>{ const k = {"1":0,"2":1,"3":2,"4":-1}[e.key]; if (k!==undefined && $("#wstart").hidden){ e.preventDefault(); judge(k); } };
  $$(".bin", m).forEach(b=>b.onclick=()=>{ if ($("#wstart").hidden) judge(+b.dataset.b); });
  $("#wstart").onclick = ()=>{ $("#wstart").hidden = true; document.addEventListener("keydown", key); next(); };
};

// 6. 最長ルート探し（クリティカル・パス）
GAMES.network = function(){
  const tasks = S.sc.net; const byId = Object.fromEntries(tasks.map(t=>[t.id,t]));
  // 最早終了とクリティカル・パス
  const ef = {}; const order = [];
  const calc = id => { if (ef[id]!==undefined) return ef[id]; const t=byId[id]; ef[id] = (t.pre.length?Math.max(...t.pre.map(calc)):0) + t.d; return ef[id]; };
  tasks.forEach(t=>calc(t.id));
  const total = Math.max(...Object.values(ef));
  const cp = new Set(); const back = id => { cp.add(id); const t=byId[id]; const start = ef[id]-t.d; t.pre.forEach(p=>{ if (ef[p]===start) back(p); }); };
  tasks.filter(t=>ef[t.id]===total && !tasks.some(u=>u.pre.includes(t.id))).forEach(t=>back(t.id));
  // レイアウト
  const lvl = {}; const L = id => lvl[id]!==undefined?lvl[id]:(lvl[id] = byId[id].pre.length?1+Math.max(...byId[id].pre.map(L)):0);
  tasks.forEach(t=>L(t.id));
  const cols = Math.max(...Object.values(lvl))+1; const colItems = {};
  tasks.forEach(t=>{ (colItems[lvl[t.id]] ||= []).push(t.id); });
  const W = 140 + cols*145 + 80, Hh = Math.max(...Object.values(colItems).map(a=>a.length))*84 + 40;
  const pos = {};
  Object.entries(colItems).forEach(([c,ids])=>ids.forEach((id,i)=>{ pos[id] = { x: 110 + (+c)*145, y: (Hh - ids.length*84)/2 + i*84 + 20 }; }));
  pos.S = { x: 20, y: Hh/2 - 21 }; pos.G = { x: 110 + cols*145, y: Hh/2 - 21 };
  const ends = tasks.filter(t=>!tasks.some(u=>u.pre.includes(t.id)));
  const edges = [];
  tasks.forEach(t=>{ if(!t.pre.length) edges.push(["S",t.id]); t.pre.forEach(p=>edges.push([p,t.id])); });
  ends.forEach(t=>edges.push([t.id,"G"]));
  const bw = id => id==="S"||id==="G" ? 54 : 118;
  const svg = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="作業のつながり図">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a66a8"/></marker></defs>
    ${edges.map(([a,b])=>{ const A=pos[a],B=pos[b]; const x1=A.x+bw(a), y1=A.y+21, x2=B.x-2, y2=B.y+21; const mx=(x1+x2)/2;
      return `<path class="nedge" data-e="${a}-${b}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" marker-end="url(#ar)"/>`; }).join("")}
    <g><rect x="${pos.S.x}" y="${pos.S.y}" width="54" height="42" rx="21" fill="#3ddbc2"/><text x="${pos.S.x+27}" y="${pos.S.y+26}" text-anchor="middle" font-family="DotGothic16" font-size="13" fill="#141a2e">開始</text></g>
    <g><rect x="${pos.G.x}" y="${pos.G.y}" width="54" height="42" rx="21" fill="#ffc857"/><text x="${pos.G.x+27}" y="${pos.G.y+26}" text-anchor="middle" font-family="DotGothic16" font-size="13" fill="#141a2e">完成</text></g>
    ${tasks.map(t=>`<g class="nnode" data-id="${t.id}" tabindex="0" role="button" aria-label="${t.n} ${t.d}日">
      <rect x="${pos[t.id].x}" y="${pos[t.id].y}" width="118" height="42" rx="4"/>
      <text x="${pos[t.id].x+8}" y="${pos[t.id].y+18}">${t.id} ${t.n}</text>
      <text class="dur" x="${pos[t.id].x+8}" y="${pos[t.id].y+35}">${t.d}${S.lv===3?"週":"日"}</text></g>`).join("")}
  </svg>`;
  const unit = S.lv===3?"週":"日";
  const choices = shuffle([...new Set([total, total-2, total+2, total-3 > 0 ? total-3 : total+3])]);
  const sel = new Set(); let pick = null;
  const m = render(`<div class="card">
    ${stageHeader(T("クリティカル・パスを探せ","いちばん長いルートを探せ"), `開始から完成まで、<b>合計日数がいちばん長くなる道</b>の作業をすべてタップしよう。そのあと全体の日数を答えよう。`)}
    ${LEVELS[S.lv].hints?`<div class="hint">ヒント：矢印は「前の作業が終わらないと始められない」という意味。道ごとに日数を足してみよう。</div>`:""}
    <div class="net">${svg.replace("<svg ", `<svg style="min-width:${Math.min(W,760)}px" `)}</div>
    <div class="small">選んだ作業：<span id="selTxt">なし</span></div>
    <div><div class="small dim">プロジェクト全体は最短で何${unit}？</div><div class="seg" id="tot">${choices.map(c=>`<button data-v="${c}">${c}${unit}</button>`).join("")}</div></div>
    <div class="row"><button class="btn" id="chk" disabled>これで決定</button></div>
  </div>`);
  const upd = ()=>{ $$(".nnode", m).forEach(n=>n.classList.toggle("sel", sel.has(n.dataset.id)));
    $("#selTxt").textContent = sel.size ? [...sel].sort().join(" → ") : "なし"; $("#chk").disabled = !sel.size || pick===null; };
  $$(".nnode", m).forEach(n=>{ const f=()=>{ const id=n.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); upd(); }; n.onclick=f; n.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();f();} }; });
  $$("#tot button", m).forEach(b=>b.onclick=()=>{ pick=+b.dataset.v; $$("#tot button").forEach(x=>x.classList.toggle("sel",x===b)); upd(); });
  $("#chk").onclick = ()=>{
    $("#chk").disabled = true;
    const exact = sel.size===cp.size && [...sel].every(x=>cp.has(x));
    const overlap = [...sel].filter(x=>cp.has(x)).length / Math.max(sel.size, cp.size);
    const tOk = pick===total;
    // 正解を表示
    $$(".nnode", m).forEach(n=>{ n.classList.remove("sel"); if (cp.has(n.dataset.id)) $("rect",n).style.stroke = "#ff6b6b"; n.onclick=null; });
    $$(".nedge", m).forEach(e=>{ const [a,b]=e.dataset.e.split("-"); if ((cp.has(a)||a==="S") && (cp.has(b)||b==="G")){ e.style.stroke="#ff6b6b"; e.style.strokeWidth="3"; } });
    $$("#tot button").forEach(x=>{ x.disabled=true; if(+x.dataset.v===total) x.style.borderColor="var(--teal)"; });
    S.flags.cpExact = exact && tOk;
    if (!exact) S.mistakes.push("クリティカル・パスを見誤った");
    const path = [...cp].sort().map(id=>byId[id].n).join(" → ");
    finish({ score: overlap*0.6 + (tOk?0.4:0), doms:["sched"], ids:["sc1","sc2","c_cp","d3","p1"], notes:[
      `正解の${T("クリティカル・パス","いちばん長いルート")}：<b>${esc(path)}</b>（合計 ${total}${unit}）。`,
      `この道にある作業が1${unit}遅れると、全体も1${unit}遅れる。だから重点的に見張る。ほかの道には少し余裕（${T("フロート","ゆとり")}）がある。`,
      "作業のつながりを見るのは「全体を見わたす」ことの練習でもある。一か所の遅れは、つながりを通って全体に広がる。",
    ]});
  };
};

// 7. 作戦会議（リスク対応・調達・予備費）
GAMES.riskplan = function(){
  const sc = S.sc; const unit = sc.unit;
  const risks = sc.risks; const ans = {}; let src = null, rsv = null;
  const isOpp = r => ["exploit","share","enhance","acceptO"].includes(r.best);
  const rates = [0, 0.1, 0.2, 0.35];
  const fmt = v => unit==="円" ? v.toLocaleString()+"円" : v.toLocaleString()+unit;
  const m = render(`<div class="card">
    ${stageHeader("作戦会議", "本番の前に、リスクへの対応・物の調達・予備のお金を決めておこう。ここで準備した分だけ、次の防衛戦が楽になる。")}
    <h3>① ${T("リスク対応の計画","もしもの時の作戦")}</h3>
    ${LEVELS[S.lv].hints?`<div class="hint">回避＝原因ごとなくす／転嫁＝保険や契約で他の人に任せる／軽減＝起こりにくく・小さくする／受容＝あえて何もしない${S.lv>=2?"<br>好機（良いこと）：活用＝必ずつかむ／共有＝得意な人と組む／強化＝起こりやすくする":""}</div>`:""}
    <div class="list" id="rk">${risks.map((r,i)=>{ const keys = isOpp(r)?["exploit","share","enhance","acceptO"]:["avoid","transfer","mitigate","accept"];
      return `<div class="centry"><div>${isOpp(r)?'<span class="tag" style="color:var(--amber)">好機</span> ':''}${esc(r.t)}</div><div class="seg" data-r="${i}">${keys.map(k=>`<button data-k="${k}" style="color:${STRAT[k].color}">${S.lv===1?STRAT[k].easy:STRAT[k].name}</button>`).join("")}</div></div>`; }).join("")}</div>
    <h3>② ${T("調達の戦略","物の用意のしかた")}：${esc(sc.sourcing.q)}</h3>
    <div class="list" id="src">${sc.sourcing.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${esc(o.t)}</b> <span class="tag">${fmt(o.cost)}</span><br><span class="small dim">${esc(o.note)}</span></button>`).join("")}</div>
    <h3>③ ${T("予備費（コンティンジェンシー予備）","もしもの時のお金")}</h3>
    <p class="small">見積りの合計は <b>${fmt(sc.budget.base)}</b>、上限は <b>${fmt(sc.budget.cap)}</b>。予備費をいくら積む？</p>
    <div class="seg" id="rsv">${rates.map((r,i)=>`<button data-i="${i}">${Math.round(r*100)}%（${fmt(Math.round(sc.budget.base*r))}）</button>`).join("")}</div>
    <div class="row"><button class="btn" id="chk" disabled>作戦決定</button></div>
  </div>`);
  const upd = ()=>{ $("#chk").disabled = Object.keys(ans).length<risks.length || src===null || rsv===null; };
  $$("#rk .seg", m).forEach(sg=>$$("button",sg).forEach(b=>b.onclick=()=>{ ans[sg.dataset.r]=b.dataset.k; $$("button",sg).forEach(x=>x.classList.toggle("sel",x===b)); upd(); }));
  $$("#src .opt", m).forEach(b=>b.onclick=()=>{ src=+b.dataset.i; $$("#src .opt").forEach(x=>x.classList.toggle("sel",x===b)); upd(); });
  $$("#rsv button", m).forEach(b=>b.onclick=()=>{ rsv=+b.dataset.i; $$("#rsv button").forEach(x=>x.classList.toggle("sel",x===b)); upd(); });
  $("#chk").onclick = ()=>{
    $("#chk").disabled = true;
    let rs = 0; const notes = [];
    risks.forEach((r,i)=>{ const a=ans[i]; const sg=$(`#rk .seg[data-r="${i}"]`);
      $$("button",sg).forEach(x=>{ x.disabled=true; if (x.dataset.k===r.best) x.style.borderColor="var(--teal)"; else if (x.dataset.k===a) x.style.borderColor="var(--coral)"; });
      if (a===r.best) rs+=1; else if (r.ok.includes(a)) rs+=0.5;
      if (a!==r.best) notes.push(`${esc(r.t)} → ${esc(r.why)}`); });
    rs /= risks.length;
    const o = sc.sourcing.opts[src]; const rate = rates[rsv];
    const over = sc.budget.base*(1+rate) + (o.cost - sc.sourcing.opts[0].cost) > sc.budget.cap;
    const rScore = rate===0?0.3 : rate===0.35?0.2 : 1;
    S.shield = rate===0?0: rate===0.1?2 : rate===0.2?3 : 4;
    S.prepared = Math.round(rs * 3);
    S.reserveRate = rate;
    S.flags.sustainable = o.sust===2;
    if (rate===0) S.mistakes.push("予備費を積まなかった");
    if (over) S.mistakes.push("予算の上限を超える計画にした");
    const score = rs*0.6 + (o.sust/2)*0.2 + rScore*0.2 - (over?0.1:0);
    finish({ score, doms:["risk","fin","gov"], ids:["k1","k2","k3","k4","f1","f2","f3","g3","c_reserve","c_threat","d7","d4","p5", ...(S.lv>=2?["c_opp"]:[])], notes:[
      `リスクは「起こりやすさ×影響」で優先順位をつけ（${T("リスク分析","リスクの大きさを測る")}）、大きいものから対応を決めて担当者をつける。`,
      ...notes.slice(0,3),
      `調達：${esc(o.t)}。${o.sust===2?"環境や地域への影響まで考えた選択。<b>持続可能性</b>はどの判断にも組み込む原則。":"安さや楽さだけでなく、環境・社会への影響（持続可能性）も判断材料にしよう。"}`,
      rate===0 ? "予備費ゼロは危険。見えているリスクへのクッション（コンティンジェンシー予備）は必要。" :
      rate===0.35 ? "予備費を積みすぎると予算を圧迫し、スポンサーの信頼も下がる。リスクの大きさに見合った額に。" :
      "予備費はちょうどよい水準。防衛戦でシールドとして働く。",
      over ? "計画が予算の上限を超えている。上限を超えるならスポンサーの承認が必要（ガバナンス）。" : "",
    ].filter(Boolean)});
  };
};
// ===== 実行・監視・終結のミニゲーム =====

function setupCanvas(cv, h){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = cv.clientWidth; cv.style.height = h+"px";
  cv.width = W*dpr; cv.height = h*dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, W, H:h };
}
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 9. リスク防衛戦（リアルタイム）
GAMES.defense = function(){
  const sc = S.sc; const sp = LEVELS[S.lv].speed;
  const list = shuffle([...sc.defense.threats.map(t=>({...t,opp:false})), ...(S.lv>=2?sc.defense.opps.map(t=>({...t,opp:true})):[])]);
  const TOTAL = list.length;
  let prepLeft = S.prepared, shield = S.shield;
  const m = render(`<div class="card">
    ${stageHeader("リスク防衛戦", `本番中！　迫ってくる「もしも」に対応策をぶつけろ。<b>先頭のリスクが自動で選ばれる</b>（タップで切りかえ）。下のボタンか 1〜4 キーで対応！`)}
    ${LEVELS[S.lv].hints?`<div class="hint">作戦会議でうまく準備できた分は、対応策のヒントが出る。${S.lv>=2?"金色は<b>好機</b>（良いリスク）。逃さずつかもう！":""}</div>`:""}
    <div class="hud"><span>健全度 <b id="hp">100</b></span><span>予備費シールド <b id="sh">${"◆".repeat(shield)||"なし"}</b></span><span>対応 <b id="cnt">0/${TOTAL}</b></span></div>
    <canvas class="cv" id="cv"></canvas>
    <div class="sbtns" id="sb"></div>
    <div class="row"><button class="btn" id="go">スタート</button></div>
  </div>`);
  const cv = $("#cv"); let {ctx,W,H} = setupCanvas(cv, 320);
  const lanes = [H*0.2, H*0.5, H*0.8];
  const baseX = W - 46;
  let enemies = [], fx = [], spawned = 0, handled = 0, pts = 0, hp = 100, sel = null, running = false, last = 0, spawnT = 0, shake = 0;
  const spawnEvery = 3.1 / sp, vx = (W-120) / (13 / sp);
  const THREAT_KEYS = ["avoid","transfer","mitigate","accept"], OPP_KEYS = ["exploit","share","enhance","acceptO"];
  let lastKind = null;
  const drawButtons = (force)=>{
    const kind = sel && sel.opp ? "opp" : "threat";
    if (kind===lastKind && !force) return; lastKind = kind;
    const keys = kind==="opp" ? OPP_KEYS : THREAT_KEYS;
    $("#sb").innerHTML = keys.map((k,i)=>`<button class="sbtn" data-k="${k}" style="border-color:${STRAT[k].color};color:${STRAT[k].color}">${STRAT[k].name}<small>${STRAT[k].easy}</small><kbd>${i+1}</kbd></button>`).join("");
    $$("#sb .sbtn").forEach(b=>b.onclick=()=>respond(b.dataset.k));
  };
  const spawn = ()=>{
    const e = list[spawned++]; ctx.font = "bold 14px 'Zen Kaku Gothic New', sans-serif";
    e.w = Math.min(ctx.measureText(e.t).width + 24, W*0.66); e.h = 34;
    e.x = -e.w; e.lane = Math.floor(Math.random()*3); e.y = lanes[e.lane] - e.h/2; e.v = vx*(0.85+Math.random()*0.3);
    e.first = null; e.prep = !e.opp && prepLeft>0 ? (prepLeft--, true) : false;
    enemies.push(e);
  };
  const pickFront = ()=>{ if (!sel || !enemies.includes(sel)){ sel = enemies.slice().sort((a,b)=>b.x-a.x)[0] || null; drawButtons(); } };
  const pop = (e, txt, col)=>fx.push({x:e.x+e.w/2, y:e.y, txt, col, t:1});
  const respond = k=>{
    if (!running) return; pickFront(); const e = sel; if (!e) return;
    const q = k===e.best ? 1 : e.ok.includes(k) ? 0.5 : 0;
    if (e.first===null) e.first = q;
    if (q>0){ pts += e.first; handled++; enemies = enemies.filter(x=>x!==e); sel=null;
      pop(e, (q===1?"◎ ":"○ ")+STRAT[k].name+"！", q===1?"#3ddbc2":"#ffc857"); $("#cnt").textContent=`${handled}/${TOTAL}`; pickFront(); }
    else { e.v *= 1.35; pop(e, "× 合わない", "#ff6b6b"); if (!S.flags.defMiss) S.flags.defMiss=[]; S.flags.defMiss.push(e.t); }
  };
  const key = e=>{ const i = ["1","2","3","4"].indexOf(e.key); if (i>=0 && running){ e.preventDefault(); pickFront(); respond((sel&&sel.opp?OPP_KEYS:THREAT_KEYS)[i]); } };
  cv.addEventListener("pointerdown", ev=>{ const r=cv.getBoundingClientRect(); const x=ev.clientX-r.left, y=ev.clientY-r.top;
    const hit = enemies.find(e=>x>=e.x-6&&x<=e.x+e.w+6&&y>=e.y-8&&y<=e.y+e.h+8); if (hit){ sel=hit; drawButtons(); } });
  const draw = ()=>{
    ctx.save(); if (shake>0) ctx.translate((Math.random()-0.5)*8,0);
    ctx.clearRect(0,0,W,H);
    lanes.forEach(y=>{ ctx.strokeStyle="#2a3358"; ctx.setLineDash([6,8]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(baseX,y); ctx.stroke(); ctx.setLineDash([]); });
    // 拠点
    ctx.fillStyle="#2a3358"; ctx.fillRect(baseX, 8, 38, H-16);
    ctx.fillStyle = hp>50?"#3ddbc2":hp>25?"#ffc857":"#ff6b6b"; ctx.fillRect(baseX+6, 8+(H-16)*(1-hp/100), 26, (H-16)*hp/100);
    ctx.save(); ctx.translate(baseX+24, H/2); ctx.rotate(Math.PI/2); ctx.fillStyle="#141a2e"; ctx.font="13px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText("PROJECT", 0, 4); ctx.restore();
    if (shield>0){ ctx.strokeStyle="#a78bfa"; ctx.lineWidth=3; ctx.globalAlpha=0.5+0.2*Math.sin(performance.now()/200); ctx.beginPath(); ctx.moveTo(baseX-10,6); ctx.lineTo(baseX-10,H-6); ctx.stroke(); ctx.globalAlpha=1; ctx.lineWidth=1; }
    enemies.forEach(e=>{
      const isSel = e===sel;
      rrect(ctx,e.x,e.y,e.w,e.h,6);
      ctx.fillStyle = e.opp ? "#3d3316" : "#3b2230"; ctx.fill();
      ctx.lineWidth = isSel?3:1.5; ctx.strokeStyle = isSel ? "#ffc857" : (e.opp?"#ffc857":"#ff6b6b"); ctx.stroke(); ctx.lineWidth=1;
      ctx.fillStyle="#eef0ff"; ctx.font="bold 14px 'Zen Kaku Gothic New', sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.save(); ctx.beginPath(); ctx.rect(e.x+4,e.y,e.w-8,e.h); ctx.clip(); ctx.fillText(e.t, e.x+12, e.y+e.h/2+1); ctx.restore();
      if (e.prep){ ctx.font="11px DotGothic16, monospace"; ctx.fillStyle=STRAT[e.best].color; ctx.fillText("準備済:"+STRAT[e.best].name, e.x+4, e.y-8); }
      if (isSel){ ctx.fillStyle="#ffc857"; ctx.beginPath(); ctx.moveTo(e.x+e.w/2-6,e.y+e.h+10); ctx.lineTo(e.x+e.w/2+6,e.y+e.h+10); ctx.lineTo(e.x+e.w/2,e.y+e.h+3); ctx.fill(); }
    });
    fx.forEach(f=>{ ctx.globalAlpha=Math.max(0,f.t); ctx.fillStyle=f.col; ctx.font="16px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText(f.txt, f.x, f.y - (1-f.t)*30); ctx.globalAlpha=1; });
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    if (!running && spawned===0){ ctx.fillStyle="#9aa3c7"; ctx.font="16px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText("スタートで本番開始", W/2, H/2); ctx.textAlign="left"; }
    ctx.restore();
  };
  const loop = now=>{
    if (!document.body.contains(cv)) { document.removeEventListener("keydown", key); return; }
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if (running){
      spawnT -= dt; if (spawned<TOTAL && spawnT<=0){ spawn(); spawnT = spawnEvery; }
      enemies.forEach(e=>{ e.x += e.v*dt; });
      enemies.filter(e=>e.x+e.w >= baseX-10).forEach(e=>{
        enemies = enemies.filter(x=>x!==e); if (sel===e) sel=null; handled++;
        if (e.first===null) e.first = 0;
        if (e.opp){ pop(e,"チャンスを逃した…","#9aa3c7"); }
        else if (shield>0){ shield--; pop(e,"予備費で吸収！","#a78bfa"); $("#sh").textContent="◆".repeat(shield)||"なし"; }
        else { hp = Math.max(0, hp-14); shake=0.3; S.dom[e.dom] = clamp(S.dom[e.dom]-5,0,100); drawChrome(); pop(e,"直撃！ "+DOMAINS[e.dom].name+"↓","#ff6b6b"); $("#hp").textContent=hp; }
        $("#cnt").textContent=`${handled}/${TOTAL}`;
      });
      pickFront();
      fx.forEach(f=>f.t-=dt*1.2); fx = fx.filter(f=>f.t>0); shake = Math.max(0, shake-dt);
      if (spawned>=TOTAL && enemies.length===0){ running=false; setTimeout(end, 600); }
    }
    draw(); requestAnimationFrame(loop);
  };
  const end = ()=>{
    document.removeEventListener("keydown", key);
    $$("#sb .sbtn").forEach(b=>b.disabled=true);
    const rate = pts/TOTAL;
    if (hp<60) S.mistakes.push("リスクの直撃を何度も受けた");
    finish({ score: rate*0.8 + hp/100*0.2, doms:["risk","sched","stake"], ids:["k5","g4","g5","c_threat", ...(S.lv>=2?["c_opp"]:[])], notes:[
      `対応の的中率 ${Math.round(rate*100)}%、プロジェクト健全度 ${hp}。`,
      "計画した対応は、きっかけ（トリガー）が来たら迷わず実行する。準備しておいたリスクほど、本番で速く正しく動ける。",
      "予備費は、見えているリスクへのクッション。使い切ったら、それ以上はスポンサーと相談が必要になる。",
      S.lv>=2 ? "リスクには<b>好機</b>もある。脅威をつぶすだけでなく、チャンスをつかみにいくのもPMの仕事。" : "リスクには良いこと（好機）もある。レベル2から登場するよ。",
      "本番中も、衛生や手順などの決めたルールが守られているか見回る。これが品質保証。",
    ]});
  };
  $("#go").onclick = ()=>{ $("#go").hidden = true; running = true; last = performance.now(); spawnT = 0.3; document.addEventListener("keydown", key); drawButtons(true); };
  drawButtons(true); last = performance.now(); requestAnimationFrame(loop);
};

// 10. 対立バトル（コマンド格闘）
GAMES.conflict = function(){
  const cf = S.sc.conflict; const rounds = cf.rounds; let r = 0, heat = 70, quality = 0, timing = 0, collabRight = false;
  const keys = Object.keys(CONF);
  const m = render(`<div class="card">
    ${stageHeader("対立バトル", `${esc(cf.a)}と${esc(cf.b)}が${esc(cf.topic)}でぶつかった！　状況に合う<b>対立解決の技</b>をえらび、タイミングよくキメて、<b>対立の熱</b>を下げろ。`)}
    <div class="arena">
      <div class="fighter" id="fa"><span class="fx">😤</span>${esc(cf.a)}</div>
      <div class="vs">VS</div>
      <div class="fighter" id="fb"><span class="fx">😠</span>${esc(cf.b)}</div>
    </div>
    <div><div class="small row" style="justify-content:space-between"><span class="pix">対立の熱</span><span class="pix" id="heatv">${heat}</span></div><div class="hp"><i id="heat" style="width:${heat}%;background:var(--coral)"></i></div></div>
    <div class="bigmove" id="bm"></div>
    <div class="centry"><div class="eyebrow" id="rn"></div><div id="sit"></div></div>
    <div id="act"></div>
  </div>`);
  const setHeat = v=>{ heat = clamp(v,0,100); $("#heat").style.width=heat+"%"; $("#heatv").textContent=heat; };
  const round = ()=>{
    const rd = rounds[r];
    $("#rn").textContent = `ROUND ${r+1} / ${rounds.length}`;
    $("#sit").textContent = rd.s;
    $("#act").innerHTML = `<div class="grid2">${keys.map(k=>`<button class="opt" data-k="${k}"><b class="pix">${CONF[k].name}</b> <span class="small dim">${CONF[k].easy}</span></button>`).join("")}</div>`;
    $$("#act .opt").forEach(b=>b.onclick=()=>meter(b.dataset.k));
  };
  const meter = k=>{
    let pos = 0, dir = 1, raf, done=false;
    const zl = 38 + Math.random()*20, zw = S.lv===1?26:S.lv===2?20:15;
    $("#act").innerHTML = `<div class="small">「${CONF[k].name}」をタイミングよくキメろ！（ボタン／スペースキー）</div>
      <div class="meter"><div class="zone" style="left:${zl}%;width:${zw}%"></div><div class="mk" id="mk"></div></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="hit">キメる！</button></div>`;
    const spd = 70 * LEVELS[S.lv].speed + 40;
    let lt = performance.now();
    const tick = now=>{ const dt=(now-lt)/1000; lt=now; pos += dir*spd*dt; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} const mk=$("#mk"); if(!mk) return; mk.style.left=pos+"%"; raf=requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    const go = ()=>{ if (done) return; done=true; cancelAnimationFrame(raf); document.removeEventListener("keydown", kd); resolve(k, pos>=zl && pos<=zl+zw); };
    const kd = e=>{ if (e.key===" "||e.key==="Enter"){ e.preventDefault(); go(); } };
    document.addEventListener("keydown", kd);
    $("#hit").onclick = go; $("#hit").focus();
  };
  const resolve = (k, crit)=>{
    const rd = rounds[r]; const q = k===rd.best?1: rd.ok.includes(k)?0.5:0;
    quality += q; timing += crit?1:0;
    if (k==="collab" && rd.best==="collab") collabRight = true;
    const mult = crit?1.25:0.8;
    const d = q===1 ? -Math.round(34*mult) : q===0.5 ? -Math.round(16*mult) : +18;
    setHeat(heat + d);
    $("#bm").textContent = `${CONF[k].move}${crit?"！！":""}`;
    ["#fa","#fb"].forEach(s=>{ $(s).classList.remove("hit"); void $(s).offsetWidth; $(s).classList.add("hit"); });
    const fxA = heat<25?"🙂":heat<55?"😐":"😤", fxB = heat<25?"😊":heat<55?"😑":"😠";
    $("#fa .fx").textContent = fxA; $("#fb .fx").textContent = fxB;
    const best = CONF[rd.best];
    $("#act").innerHTML = `<div class="centry"><div>${q===1?"<b style='color:var(--teal)'>効果ばつぐん！</b>":q===0.5?"<b style='color:var(--amber)'>まあまあ効いた</b>":"<b style='color:var(--coral)'>逆効果…</b>"} ${crit?"（クリティカル）":""}</div>
      <div class="small">この場面のベストは「${best.name}（${best.easy}）」。${q<1?explain(rd.best):""}</div></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="nx">${r+1<rounds.length?"次のラウンド ▶":"決着！"}</button></div>`;
    $("#nx").onclick = ()=>{ r++; $("#bm").textContent=""; if (r<rounds.length) round(); else end(); };
    $("#nx").focus();
  };
  const explain = k => ({
    withdraw:"時間がなく感情が高ぶっているときは、いったん引いて冷ますのが得策。問題は後で必ず扱う。",
    collab:"時間があり、目的が同じなら、全員が納得する解決策を一緒に探すのが一番長持ちする。",
    force:"締切が迫り決めるしかないときは、権限を持つ人が決める。理由は後でていねいに説明する。",
    smooth:"小さな対立なら、共通点を強調して場を和ませ、本当に大事なことに集中する。",
    comprom:"お互いが少しずつ譲る。早く決まるが、全員が少し不満を残すこともある。",
  })[k];
  const end = ()=>{
    S.flags.collabRight = collabRight;
    const score = (quality/rounds.length)*0.8 + (timing/rounds.length)*0.2;
    $("#act").innerHTML = "";
    finish({ score, doms:["res","stake"], ids:["r4","c_conf","p6","m2"], notes:[
      `対立は悪いものではない。うまく扱えば、より良い答えにたどりつくきっかけになる。`,
      `5つの手（協調・妥協・鎮静・強制・撤退）に「いつでも正解」はない。<b>時間・関係の大切さ・問題の大きさ</b>で使い分ける。`,
      "チームが安心して意見をぶつけられる雰囲気（心理的安全性）をつくるのも、リーダーの仕事。",
    ]});
  };
  round();
};

// 11. 関係者ボス戦
GAMES.boss = function(){
  const b = S.sc.boss; let r = 0, hp = 100, q = 0; const per = 100 / b.rounds.length; let escalated = false;
  const m = render(`<div class="card">
    ${stageHeader(`ボス戦：${esc(b.name)}`, `${esc(b.role)}。プロジェクトに反対している。相手の気持ちに合う関わり方で、<b>抵抗ゲージ</b>をゼロにしよう。`)}
    <div class="speech"><div class="face" style="width:84px;height:84px;font-size:54px">${b.face}</div><div class="bubble" id="bl"><span class="who">${esc(b.name)}</span></div></div>
    <div><div class="small row" style="justify-content:space-between"><span class="pix">抵抗</span><span class="pix" id="hpv">100</span></div><div class="hp"><i id="hpb" style="width:100%;background:var(--violet)"></i></div></div>
    <div class="row"><span class="small dim">相手の様子：</span><span class="tag" id="mood"></span></div>
    <div class="grid2" id="acts">${Object.entries(BOSS_ACTIONS).map(([k,a])=>`<button class="opt" data-k="${k}">${esc(a.name)} <span class="tag">${a.kind}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`);
  const show = ()=>{ const rd=b.rounds[r]; $("#bl").innerHTML=`<span class="who">${esc(b.name)}</span>${esc(rd.line)}`; $("#mood").textContent = S.lv===3 ? "？（セリフから読み取ろう）" : rd.mood; $$("#acts .opt").forEach(x=>x.disabled=false); $("#fb").innerHTML=""; };
  const lines = { escalate:"上の人に言いつけられた…と感じて、かえって心を閉ざしてしまった。", blast:"一斉連絡は読まれなかった。大事な相手には、個別に向き合おう。" };
  $$("#acts .opt", m).forEach(btn=>btn.onclick=()=>{
    const k = btn.dataset.k, rd = b.rounds[r];
    const qq = k===rd.best?1: rd.ok.includes(k)?0.5:0; q += qq;
    if (k==="escalate") escalated = true;
    hp = clamp(hp - (qq===1?per: qq===0.5?per*0.5 : -10), 0, 100);
    $("#hpb").style.width = hp+"%"; $("#hpv").textContent = Math.round(hp);
    $$("#acts .opt").forEach(x=>x.disabled=true);
    const bestName = BOSS_ACTIONS[rd.best].name;
    $("#fb").innerHTML = `<div class="centry"><div>${qq===1?"<b style='color:var(--teal)'>心が動いた！</b>":qq===0.5?"<b style='color:var(--amber)'>少し伝わった</b>":"<b style='color:var(--coral)'>反発された…</b>"}</div>
      <div class="small">${lines[k] && qq===0 ? lines[k] : ""} ${qq<1?`ここでは「${esc(bestName)}」が効果的だった。`:""}</div></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="nx">${r+1<b.rounds.length?"つぎのターン ▶":"決着！"}</button></div>`;
    $("#nx").onclick = ()=>{ r++; if (r<b.rounds.length) show(); else end(); };
    $("#nx").focus();
  });
  const end = ()=>{
    S.flags.bossNoEscalate = !escalated;
    const score = q / b.rounds.length;

    $("#acts").innerHTML = "";
    if (score<0.5) S.mistakes.push("反対している関係者と向き合いきれなかった");
    finish({ score, doms:["stake","gov"], ids:["st4","st5","st6","p4","m1"], notes:[
      "反対する人の多くは「知らない」「不安」「置いてけぼり」。まず話を聞き、根拠を示し、巻き込み、進みを知らせ続ける。",
      "伝え方には、一方的に送る（プッシュ）・置いておく（プル）・対話する（インタラクティブ）がある。大事な相手ほど対話を。",
      escalated ? "上の人に頼る（エスカレーション）は最後の手段。先に自分で向き合うのが、説明責任を果たすリーダー。" : "上の人に頼らず、自分で向き合った。説明責任を果たすリーダーの姿勢だ。",
      "関わり方を変えたあとは、相手の態度がどう変わったかを見て、次の手を調整する（エンゲージメントの監視）。",
    ]});

  show();
};

// 12. 変更要求シューター
GAMES.shooter = function(){
  const sc = S.sc; const sp = LEVELS[S.lv].speed;
  const n = S.lv===1?8:S.lv===2?9:10;
  const pool = shuffle([...sc.changes.good.map(t=>({t,good:true})), ...sc.changes.bad.map(t=>({t,good:false}))]).slice(0,n);
  if (!pool.some(p=>p.good)) pool[0] = {t:sc.changes.good[0], good:true};
  const m = render(`<div class="card">
    ${stageHeader("変更要求シューター", `いろんな人から変更の要望が降ってくる！　<b>価値につながる変更は受け止めて</b>変更管理へ、<b>スコープ・クリープは撃ち落とせ</b>。放置もダメ。`)}
    ${LEVELS[S.lv].hints?`<div class="hint">操作：マウス／指で左右移動、クリックかスペースで発射（スマホは下の発射ボタン）。受け止める＝自機に当てる。</div>`:""}
    <div class="hud"><span>正しい判断 <b id="sc">0</b></span><span>のこり <b id="lf">${n}</b></span></div>
    <canvas class="cv" id="cv"></canvas>
    <div class="row"><button class="btn" id="go">スタート</button><button class="btn ghost" id="fire" hidden>発射</button></div>
  </div>`);
  const cv = $("#cv"); const {ctx,W,H} = setupCanvas(cv, 380);
  let ship = W/2, items = [], shots = [], fx = [], spawned = 0, doneN = 0, right = 0, running=false, last=0, spawnT=0, cool=0, keys={};
  const log = { acceptGood:0, rejectGood:0, acceptBad:0, rejectBad:0, ignored:0 };
  const vy = H / (7.5 / sp), every = 2.5 / sp;
  const spawn = ()=>{ const p = pool[spawned++]; ctx.font="bold 14px 'Zen Kaku Gothic New', sans-serif"; const w = Math.min(ctx.measureText(p.t).width+26, W-20);
    items.push({...p, w, h:32, x: 10 + Math.random()*(W-20-w), y:-34}); };
  const pop = (x,y,txt,col)=>fx.push({x,y,txt,col,t:1});
  const fire = ()=>{ if (!running || cool>0) return; shots.push({x:ship, y:H-44}); cool=0.22; };
  const judge = (it, accepted)=>{
    items = items.filter(x=>x!==it); doneN++;
    const ok = accepted===it.good; if (ok) right++;
    if (accepted===null){ log.ignored++; pop(it.x+it.w/2, H-60, "放置…", "#9aa3c7"); }
    else if (accepted){ it.good?log.acceptGood++:log.acceptBad++; pop(it.x+it.w/2, it.y, it.good?"変更管理へ → 承認！":"クリープを入れてしまった", it.good?"#3ddbc2":"#ff6b6b"); }
    else { it.good?log.rejectGood++:log.rejectBad++; pop(it.x+it.w/2, it.y, it.good?"価値ある変更を却下…":"撃退！", it.good?"#ff6b6b":"#ffc857"); }
    $("#sc").textContent = right; $("#lf").textContent = n - doneN;
  };
  const kd = e=>{ keys[e.key]=true; if (e.key===" "){ e.preventDefault(); fire(); } if (e.key.startsWith("Arrow")) e.preventDefault(); };
  const ku = e=>{ keys[e.key]=false; };
  cv.addEventListener("pointermove", e=>{ const r=cv.getBoundingClientRect(); ship = clamp(e.clientX-r.left, 24, W-24); });
  cv.addEventListener("pointerdown", e=>{ const r=cv.getBoundingClientRect(); ship = clamp(e.clientX-r.left, 24, W-24); if (e.pointerType!=="touch") fire(); else $("#fire").hidden=false; });
  const draw = ()=>{
    ctx.clearRect(0,0,W,H);
    for (let i=0;i<30;i++){ ctx.fillStyle="#ffffff18"; ctx.fillRect((i*97)%W, ((i*53)+performance.now()/30)%H, 2, 2); }
    items.forEach(it=>{ rrect(ctx,it.x,it.y,it.w,it.h,16); ctx.fillStyle="#2a3358"; ctx.fill(); ctx.strokeStyle="#9aa3c7"; ctx.stroke();
      ctx.fillStyle="#eef0ff"; ctx.font="bold 14px 'Zen Kaku Gothic New', sans-serif"; ctx.textBaseline="middle"; ctx.textAlign="left";
      ctx.save(); ctx.beginPath(); ctx.rect(it.x+6,it.y,it.w-12,it.h); ctx.clip(); ctx.fillText(it.t, it.x+13, it.y+it.h/2+1); ctx.restore(); });
    ctx.fillStyle="#ffc857"; shots.forEach(s=>ctx.fillRect(s.x-2, s.y-10, 4, 12));
    // 自機
    ctx.fillStyle="#3ddbc2"; ctx.beginPath(); ctx.moveTo(ship, H-46); ctx.lineTo(ship+24, H-14); ctx.lineTo(ship-24, H-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#141a2e"; ctx.font="10px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText("PM", ship, H-22);
    fx.forEach(f=>{ ctx.globalAlpha=Math.max(0,f.t); ctx.fillStyle=f.col; ctx.font="15px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText(f.txt, clamp(f.x,80,W-80), f.y-(1-f.t)*24); ctx.globalAlpha=1; });
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    if (!running && spawned===0){ ctx.fillStyle="#9aa3c7"; ctx.font="16px DotGothic16, monospace"; ctx.textAlign="center"; ctx.fillText("スタートで開始", W/2, H/2); ctx.textAlign="left"; }
  };
  const loop = now=>{
    if (!document.body.contains(cv)){ document.removeEventListener("keydown",kd); document.removeEventListener("keyup",ku); return; }
    const dt = Math.min(0.05,(now-last)/1000); last=now;
    if (running){
      if (keys.ArrowLeft) ship = clamp(ship-340*dt,24,W-24); if (keys.ArrowRight) ship = clamp(ship+340*dt,24,W-24);
      cool = Math.max(0, cool-dt);
      spawnT -= dt; if (spawned<n && spawnT<=0){ spawn(); spawnT=every; }
      items.forEach(it=>it.y += vy*dt);
      shots.forEach(s=>s.y -= 520*dt); shots = shots.filter(s=>s.y>-20);
      shots.forEach(s=>{ const it = items.find(it=>s.x>=it.x&&s.x<=it.x+it.w&&s.y>=it.y&&s.y<=it.y+it.h); if (it){ s.y=-99; judge(it,false); } });
      items.filter(it=>it.y+it.h>=H-46 && it.y<=H-14 && ship>=it.x-10 && ship<=it.x+it.w+10).forEach(it=>judge(it,true));
      items.filter(it=>it.y>H).forEach(it=>judge(it,null));
      fx.forEach(f=>f.t-=dt*1.1); fx=fx.filter(f=>f.t>0);
      if (spawned>=n && items.length===0){ running=false; setTimeout(end,700); }
    }
    draw(); requestAnimationFrame(loop);
  };
  const end = ()=>{
    document.removeEventListener("keydown",kd); document.removeEventListener("keyup",ku);
    $("#fire").hidden = true;
    S.flags.shooterRate = right/n;
    if (log.acceptBad>1) S.mistakes.push("スコープ・クリープを受け入れてしまった");
    const approachNote = S.approach==="pred" ? "予測型では、変更は正式な手続き（変更管理）を通して慎重に扱う。" : "適応型・ハイブリッドでは、変化は歓迎しつつ、優先順位（バックログ）で価値の高いものから取り込む。";
    finish({ score: right/n, doms:["scope","gov","fin"], ids:["s5","g8","g7","c_ccb","a4"], notes:[
      `受け止めた良い変更 ${log.acceptGood}／撃ち落としたクリープ ${log.rejectBad}／却下した良い変更 ${log.rejectGood}／入れてしまったクリープ ${log.acceptBad}／放置 ${log.ignored}`,
      "変更はすべて悪ではない。安全・法令・価値につながる変更は歓迎する。ただし必ず<b>影響を評価して、決められた人が承認</b>してから反映する。",
      "手続きなしに「ついでに」が積み重なるのが<b>スコープ・クリープ</b>。気づいたら予算も日程も足りなくなる。",
      approachNote,
      "要望を放置するのも悪手。受け入れるか断るか、記録して必ず答えを返そう。",
    ]});
  };
  $("#go").onclick = ()=>{ $("#go").hidden=true; running=true; last=performance.now(); spawnT=0.2; document.addEventListener("keydown",kd); document.addEventListener("keyup",ku); if (matchMedia("(pointer:coarse)").matches) $("#fire").hidden=false; };
  $("#fire").onclick = fire;
  last = performance.now(); requestAnimationFrame(loop);
};

// 13. 計器を読め（アーンド・バリュー）
GAMES.evm = function(){
  const sc = S.sc, ev = sc.evm, unit = sc.unit; let r = 0, pts = 0, max = 0;
  const lab = S.lv===1 ? { pv:"予定の進み", ev:"できた分", ac:"使ったお金" } : { pv:"PV 計画価値", ev:"EV 出来高", ac:"AC 実コスト" };
  const fmt = v => unit==="円" ? v.toLocaleString()+"円" : v.toLocaleString()+unit;
  const m = render(`<div class="card">
    ${stageHeader(T("アーンド・バリューを読め","計器を読め"), `プロジェクトの計器盤を読んで、<b>スケジュール</b>と<b>コスト</b>の状態を診断しよう。全${ev.rounds.length}回。`)}
    ${LEVELS[S.lv].hints?`<div class="hint">${S.lv===1?"「できた分」が「予定の進み」より少ない→遅れ。「できた分」より「使ったお金」が多い→お金の使いすぎ。":"SPI＝EV÷PV（1未満＝遅れ）、CPI＝EV÷AC（1未満＝予算超過）"}</div>`:""}
    <div id="ev"></div>
  </div>`);
  const round = ()=>{
    const d = ev.rounds[r]; const max0 = Math.max(d.pv,d.ev,d.ac)*1.15;
    const spi = d.ev/d.pv, cpi = d.ev/d.ac;
    const sAns = spi<0.97?"late": spi>1.03?"early":"on", cAns = cpi<0.97?"over": cpi>1.03?"under":"on";
    const eac = Math.round(ev.bac/cpi);
    const eacOpts = shuffle([...new Set([eac, ev.bac, Math.round(ev.bac*cpi), ev.bac + (d.ac-d.ev)])]);
    let sPick=null, cPick=null, ePick=null;
    const bar = (k,v,c)=>`<div class="evb"><span>${lab[k]}</span><div class="tr"><i style="width:${v/max0*100}%;background:${c}"></i></div><span class="v">${fmt(v)}</span></div>`;
    $("#ev").innerHTML = `<div class="centry">
      <div class="eyebrow">第${r+1}週の報告 ／ 総予算 ${fmt(ev.bac)}</div>
      <div class="evbars">${bar("pv",d.pv,"#5ec8ff")}${bar("ev",d.ev,"#3ddbc2")}${bar("ac",d.ac,"#ff8a5b")}</div>
    </div>
    <div><div class="small">スケジュールは？</div><div class="seg" id="sS"><button data-v="late">遅れている</button><button data-v="on">予定どおり</button><button data-v="early">前倒し</button></div></div>
    <div><div class="small">コストは？</div><div class="seg" id="sC"><button data-v="over">予算超過</button><button data-v="on">予定どおり</button><button data-v="under">予算より安い</button></div></div>
    ${S.lv===3?`<div><div class="small">このままのコスト効率で進むと、完成時の総コスト（EAC）は？</div><div class="seg" id="sE">${eacOpts.map(v=>`<button data-v="${v}">${fmt(v)}</button>`).join("")}</div></div>`:""}
    <div class="row"><button class="btn" id="ok" disabled>診断する</button></div><div id="res"></div>`;
    const upd = ()=>{ $("#ok").disabled = sPick===null||cPick===null||(S.lv===3&&ePick===null); };
    const seg = (id, set)=>$$(`#${id} button`).forEach(b=>b.onclick=()=>{ set(b.dataset.v); $$(`#${id} button`).forEach(x=>x.classList.toggle("sel",x===b)); upd(); });
    seg("sS", v=>sPick=v); seg("sC", v=>cPick=v); if (S.lv===3) seg("sE", v=>ePick=+v);
    $("#ok").onclick = ()=>{
      $("#ok").disabled = true; $$("#ev .seg button").forEach(b=>b.disabled=true);
      let g = (sPick===sAns?1:0) + (cPick===cAns?1:0) + (S.lv===3?(ePick===eac?1:0):0); const mx = S.lv===3?3:2;
      pts += g; max += mx;
      const mark = (id, ans)=>$$(`#${id} button`).forEach(b=>{ if (b.dataset.v==String(ans)) b.style.borderColor="var(--teal)"; });
      mark("sS",sAns); mark("sC",cAns); if (S.lv===3) mark("sE",eac);
      const act = sAns==="late"&&cAns==="over" ? "遅れも予算超過もある。原因を調べ、スポンサーに正直に報告して、範囲の優先順位を見直そう。"
        : sAns==="late" ? "遅れているがお金には余裕。クリティカル・パス上の作業に人を足す手がある。"
        : cAns==="over" ? "予定どおりだがお金を使いすぎ。このペースだと最後に予算が足りなくなる。コストの原因を探そう。"
        : "順調！　ただし油断せず、リスクと関係者の様子も見続けよう。";
      $("#res").innerHTML = `<div class="centry"><div><b style="color:${g===mx?'var(--teal)':'var(--amber)'}">${g}/${mx} 正解</b>　${S.lv===1?"":`SPI ${spi.toFixed(2)} ／ CPI ${cpi.toFixed(2)}${S.lv===3?` ／ EAC ≒ ${fmt(eac)}`:""}`}</div><div class="small">${act}</div></div>
        <div class="row" style="margin-top:8px"><button class="btn" id="nx">${r+1<ev.rounds.length?"次の週へ ▶":"診断終了"}</button></div>`;
      $("#nx").onclick = ()=>{ r++; if (r<ev.rounds.length) round(); else end(); };
      $("#nx").focus();
    };
  };
  const end = ()=>{
    $("#ev").innerHTML = "";
    finish({ score: pts/max, doms:["fin","sched","gov"], ids:["f4","sc3","c_evm","k6","r5","st7"], notes:[
      `進み具合とお金を別々に見ると判断を誤る。${T("アーンド・バリュー","「できた分の価値」")}なら、予定・できた分・使ったお金を同じ物差しで比べられる。`,
      S.lv>=2 ? "SPI（スケジュール効率）＝EV÷PV、CPI（コスト効率）＝EV÷AC。どちらも1より小さいと要注意。" : "「できた分」を物差しにすると、遅れと使いすぎが一目で分かる。",
      S.lv===3 ? "完成時の総コスト見込み（EAC）は、今の効率が続くならBAC÷CPIで予測できる。" : "",
      "監視の対象はお金と日程だけではない。リスク一覧、人やモノの使われ方、情報がちゃんと伝わっているかも定期的に確かめる。",
    ].filter(Boolean)});
  };
  round();
};

// 14. しめくくりの儀（終結の順番）
GAMES.close = function(){
  const steps = S.sc.close; const shuffled = shuffle(steps.map((t,i)=>({t,i}))); const seq = [];
  const m = render(`<div class="card">
    ${stageHeader("しめくくりの儀", "本番終了！　でも、プロジェクトはまだ終わっていない。終結でやることを、<b>正しい順番</b>にタップして並べよう。")}
    ${LEVELS[S.lv].hints?`<div class="hint">ヒント：まず「できたもの」を認めてもらうところから。お祝いは最後！</div>`:""}
    <div class="list" id="pool">${shuffled.map((s,k)=>`<button class="opt" data-k="${k}">${esc(s.t)}</button>`).join("")}</div>
    <h3>あなたの順番</h3>
    <ol id="seq" class="list" style="padding-left:1.4em;margin:0"></ol>
    <div class="row"><button class="btn ghost" id="undo">ひとつ戻す</button><button class="btn" id="ok" disabled>これで終結！</button></div>
  </div>`);
  const upd = ()=>{ $("#seq").innerHTML = seq.map(k=>`<li>${esc(shuffled[k].t)}</li>`).join(""); $$("#pool .opt").forEach(b=>b.hidden = seq.includes(+b.dataset.k)); $("#ok").disabled = seq.length!==steps.length; };
  $$("#pool .opt", m).forEach(b=>b.onclick=()=>{ seq.push(+b.dataset.k); upd(); });
  $("#undo").onclick = ()=>{ seq.pop(); upd(); };
  $("#ok").onclick = ()=>{
    $("#ok").disabled = true; $("#undo").disabled = true;
    const order = seq.map(k=>shuffled[k].i);
    // 最長増加部分列で部分点
    const lis = order.reduce((acc,v)=>{ const i = acc.findIndex(x=>x>=v); if (i<0) acc.push(v); else acc[i]=v; return acc; }, []).length;
    const score = (lis-1)/(steps.length-1);
    $$("#seq li").forEach((li,idx)=>{ li.style.color = order[idx]===idx ? "var(--teal)" : "var(--coral)"; });
    finish({ score, doms:["gov","scope","stake"], ids:["s6","g9","a5"], extra:`<ol class="small" style="margin:0;padding-left:1.4em">${steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`, notes:[
      "終結は「成果物を受け入れてもらう」ことから始まる。確認と承認がないまま終えると、あとで「頼んだものと違う」が起きる。",
      "引き継ぎ・教訓の記録・契約の完了・メンバーの解放まで済ませて、はじめて正式に終われる。",
      "最後に、チームの頑張りをたたえよう。次のプロジェクトへの力になる。",
    ]});
  };
};

// ===== 結果 =====
function radar(vals, labels){
  const n = vals.length, cx=150, cy=140, R=100;
  const pt = (i,r)=>[cx + r*Math.sin(2*Math.PI*i/n), cy - r*Math.cos(2*Math.PI*i/n)];
  const ring = f => vals.map((_,i)=>pt(i,R*f).join(",")).join(" ");
  const poly = vals.map((v,i)=>pt(i,R*v/100).join(",")).join(" ");
  return `<svg viewBox="-40 0 380 290" style="max-width:340px;width:100%" role="img" aria-label="7つの領域のバランス">
    ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#39447a"/>`).join("")}
    ${vals.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#39447a"/>`}).join("")}
    <polygon points="${poly}" fill="#ffc85740" stroke="#ffc857" stroke-width="2"/>
    ${vals.map((v,i)=>{const [x,y]=pt(i,R+22);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="DotGothic16" font-size="12" fill="#eef0ff">${labels[i]}</text><text x="${x}" y="${y+14}" text-anchor="middle" font-family="DotGothic16" font-size="11" fill="#ffc857">${Math.round(v)}</text>`}).join("")}
  </svg>`;
}

function showResult(){
  drawChrome();
  const keys = LEVELS[S.lv].gauges;
  const avg = keys.reduce((a,k)=>a+S.dom[k],0)/keys.length;
  const valueScore = Math.round(clamp(avg*0.7 + (S.flags.askedValue?12:0) + (S.flags.shooterRate||0)*18, 0, 100));
  const rank = valueScore>=85?"S":valueScore>=72?"A":valueScore>=58?"B":valueScore>=45?"C":"D";
  const best = store.get("pq_best", {}); const order="DCBAS";
  if (!best[S.lv] || order.indexOf(rank)>order.indexOf(best[S.lv])){ best[S.lv]=rank; store.set("pq_best", best); }
  const sc = S.scores;
  const badges = [
    { id:"p1", on: S.flags.cpExact && (S.flags.mapScore||0)>=0.8, how:"最長ルートと関係者マップを両方ほぼ完ぺきに" },
    { id:"p2", on: S.flags.askedValue && (S.flags.shooterRate||0)>=0.7, how:"目的を聞き出し、変更を価値で判断" },
    { id:"p3", on: S.flags.qualityCard && (sc.close||0)>=0.6, how:"品質の作業を計画し、正しく終結" },
    { id:"p4", on: S.flags.bossNoEscalate && (sc.boss||0)>=0.6, how:"反対者に自分で向き合った" },
    { id:"p5", on: !!S.flags.sustainable, how:"環境や地域に配慮した調達" },
    { id:"p6", on: S.flags.collabRight && (sc.conflict||0)>=0.6, how:"対立を建設的に解決" },
  ];
  unlock(["m1","m2","m3","c_ai"]); drawChrome();
  const earned = badges.filter(b=>b.on).length;
  const comment = rank==="S" ? "見事！　価値を届け、チームも関係者も守りきった。" :
    rank==="A" ? "よくやった！　プロジェクトは成功だ。" :
    rank==="B" ? "なんとか完了。いくつかの領域に課題が残った。" :
    rank==="C" ? "ギリギリ完了…。つまずいた所を図鑑で確かめよう。" : "炎上してしまった…。でも失敗は最高の教訓だ。";
  const m = render(`<div class="card">
    <div class="eyebrow">MISSION COMPLETE ／ Lv${S.lv} ${esc(S.sc.title)}</div>
    <div class="row" style="gap:20px;align-items:center">
      <div class="rank" aria-label="ランク ${rank}">${rank}</div>
      <div style="flex:1;min-width:200px"><h2>届けた価値：${valueScore}</h2><p>${comment}</p></div>
    </div>
    <div class="row" style="justify-content:center">${radar(DOMAIN_KEYS.map(k=>S.dom[k]), DOMAIN_KEYS.map(k=>domLabel(k)))}</div>
    <p class="small dim">評価は「予定どおり・予算内か」だけでは決まらない。目的（価値）を確かめたか、価値ある変更を取り込めたか、7つの領域のバランスはどうかを合わせて見ている。</p>
    <h3>原則バッジ ${earned}/6</h3>
    <div class="badges">${badges.map(b=>`<div class="badge ${b.on?'on':'off'}"><b>${b.on?'★ ':'☆ '}${esc(CODEX_BY_ID[b.id].name)}</b><span class="small">${b.on?'獲得！':'条件：'+esc(b.how)}</span></div>`).join("")}</div>
    ${S.mistakes.length?`<div class="note"><h3>つまずきポイント</h3><ul>${[...new Set(S.mistakes)].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <div class="small">知識図鑑 ${unlocked.size}/${CODEX.length} 登録</div>
    <div class="progress"><i style="width:${unlocked.size/CODEX.length*100}%"></i></div>
    <div class="row">
      ${S.lv<3?`<button class="btn" id="nextLv">Lv${S.lv+1}に挑戦 ▶</button>`:""}
      <button class="btn ghost" id="again">もう一度</button>
      <button class="btn ghost" id="cx">図鑑を見る</button>
      <button class="btn ghost" id="home">タイトルへ</button>
    </div>
  </div>`);
  const lv = S.lv;
  $("#nextLv") && ($("#nextLv").onclick = ()=>{ newGame(lv+1); showIntro(); });
  $("#again").onclick = ()=>{ newGame(lv); showIntro(); };
  $("#cx").onclick = ()=>openCodex();
  $("#home").onclick = showTitle;
}

// ===== 起動 =====
$("#homeBtn").onclick = ()=>{ showTitle(); };
$("#codexBtn").onclick = ()=>openCodex();
showTitle();
</script>

</body></html>
